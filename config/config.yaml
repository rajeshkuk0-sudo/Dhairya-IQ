corpus:
  version: "v1"
  sources_file: "sources.md"

embedding:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cpu"
  batch_size: 32

vector_db:
  type: "chroma"
  persist_dir: "data/chroma"
  collection: "mf_faq_allminilml6v2_v1"
  distance: "cosine"

chunking:
  strategy: "auto"
  chunk_size: 800
  chunk_overlap: 120

retrieval:
  top_k: 4

llm:
  provider: "groq"
  temperature: 0.2
  max_tokens: 300
  timeout_s: 30

guardrails:
  enabled: true
  pii_patterns_file: "config/prompts/pii_patterns.yaml"

paths:
  raw: "data/raw"
  clean: "data/clean"
  chunks: "data/chunks"
  embeddings: "data/embeddings"
  retrieval: "data/retrieval"
  generation: "data/generation"
  runs: "data/runs"

ui:
  title: "Dhairya-IQ"
  example_questions:
    - "What is the expense ratio of HDFC Flexi Cap Fund Direct Growth?"
    - "What is the mandatory lock-in period for HDFC ELSS Tax Saver Fund?"
    - "What is the exit load and minimum SIP for HDFC Mid Cap Fund?"
    - "Should I invest in HDFC Large Cap Fund?"
  disclaimer: "Facts-only. No investment advice."
